spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DATABASE_USERNAME:order_service}
    password: ${DATABASE_PASSWORD:order-local-password}
    hikari:
      pool-name: order-service-pool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    template:
      observation-enabled: true
    listener:
      ack-mode: record
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOYMENT_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jvm.gc.pause: true
      minimum-expected-value:
        http.server.requests: 5ms
        jvm.gc.pause: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        jvm.gc.pause: 10s
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

order:
  outbox:
    fixed-delay: 500ms
    publish-timeout: 5s

grpc:
  client:
    inventory:
      address: ${INVENTORY_GRPC_TARGET:static://localhost:9090}
      negotiation-type: plaintext
