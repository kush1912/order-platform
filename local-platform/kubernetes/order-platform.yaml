apiVersion: batch/v1
kind: Job
metadata:
  name: toxiproxy-init
  namespace: order-platform-k8s
  labels:
    app.kubernetes.io/name: toxiproxy-init
    app.kubernetes.io/part-of: order-platform
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toxiproxy-init
        app.kubernetes.io/part-of: order-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: toxiproxy-init
          image: curlimages/curl:8.15.0
          command:
            - /bin/sh
            - -c
            - |
              until curl --silent --fail http://toxiproxy:8474/version >/dev/null; do
                sleep 2
              done
              until curl --silent --fail http://order-service:8080/actuator/health/readiness >/dev/null; do
                sleep 2
              done
              curl --silent --fail \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{"name":"order-service","listen":"0.0.0.0:8666","upstream":"order-service:8080"}' \
                http://toxiproxy:8474/proxies \
                || curl --silent --fail http://toxiproxy:8474/proxies/order-service >/dev/null
---
