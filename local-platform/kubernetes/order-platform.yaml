          env:
            - name: DEPLOYMENT_ENVIRONMENT
              value: kubernetes-local
            - name: ORDER_SERVICE_BASE_URL
              value: http://toxiproxy:8666
            - name: INVENTORY_SERVICE_BASE_URL
              value: http://inventory-service:8080
            - name: OTLP_TRACING_ENDPOINT
              value: http://jaeger:4318/v1/traces
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
