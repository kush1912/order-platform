apiVersion: v1
kind: Namespace
metadata:
  name: order-platform-k8s
  labels:
    app.kubernetes.io/part-of: order-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: local-platform-secrets
  namespace: order-platform-k8s
type: Opaque
stringData:
  postgres-admin-password: local-postgres-password
  order-database-password: order-local-password
  inventory-database-password: inventory-local-password
  notification-database-password: notification-local-password
  redis-password: local-redis-password
  grafana-admin-user: admin
  grafana-admin-password: local-grafana-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: order-platform-k8s
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: order-platform-k8s
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: order-platform-k8s
spec:
  accessModes:
    - ReadWriteOnce
  resources:
