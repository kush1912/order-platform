apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-platform-k8s
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: order-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: order-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do sleep 2; done
              until nc -z kafka 9092; do sleep 2; done
        - name: wait-for-kafka-topics
