            - |
              until wget -qO- http://toxiproxy:8474/proxies/order-service >/dev/null; do sleep 2; done
              until wget -qO- http://inventory-service:8080/actuator/health/readiness >/dev/null; do sleep 2; done
              until wget -qO- http://notification-service:8080/actuator/health/readiness >/dev/null; do sleep 2; done
      containers:
