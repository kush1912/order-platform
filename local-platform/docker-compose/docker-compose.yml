name: order-platform

services:
  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: deploy/docker/Dockerfile
    image: order-platform/api-gateway:local
    container_name: order-platform-api-gateway
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      ORDER_SERVICE_BASE_URL: http://toxiproxy:8666
      INVENTORY_SERVICE_BASE_URL: http://inventory-service:8080
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      toxiproxy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - edge
      - backend
      - observability

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: order-platform-toxiproxy
    ports:
      - "8474:8474"
    restart: unless-stopped
    networks:
      - edge
      - backend

  toxiproxy-init:
    image: curlimages/curl:8.15.0
    container_name: order-platform-toxiproxy-init
    depends_on:
      order-service:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        until curl --silent --fail http://toxiproxy:8474/version >/dev/null; do
          sleep 1
        done
        curl --silent --fail \
          --request POST \
          --header 'Content-Type: application/json' \
          --data '{"name":"order-service","listen":"0.0.0.0:8666","upstream":"order-service:8080"}' \
          http://toxiproxy:8474/proxies \
          || curl --silent --fail http://toxiproxy:8474/proxies/order-service >/dev/null
    restart: "no"
    networks:
      - backend

  order-service:
    build:
      context: ../../order-service
      dockerfile: deploy/docker/Dockerfile
    image: order-platform/order-service:local
    container_name: order-platform-order-service
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/order_db
      DATABASE_USERNAME: order_service
      DATABASE_PASSWORD: order-local-password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - observability

  inventory-service:
    build:
      context: ../../inventory-service
      dockerfile: deploy/docker/Dockerfile
    image: order-platform/inventory-service:local
    container_name: order-platform-inventory-service
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/inventory_db
      DATABASE_USERNAME: inventory_service
      DATABASE_PASSWORD: inventory-local-password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - observability

  notification-service:
    build:
      context: ../../notification-service
      dockerfile: deploy/docker/Dockerfile
    image: order-platform/notification-service:local
    container_name: order-platform-notification-service
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/notification_db
      DATABASE_USERNAME: notification_service
      DATABASE_PASSWORD: notification-local-password
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
      EMAIL_FROM: orders@orderplatform.local
      SMS_PROVIDER_BASE_URL: http://sms-provider:8080
      WHATSAPP_PROVIDER_BASE_URL: http://whatsapp-provider:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      sms-provider:
        condition: service_healthy
      whatsapp-provider:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - observability

  postgres:
    image: postgres:17.5-alpine
    container_name: order-platform-postgres
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-postgres-password}
      POSTGRES_DB: platform_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=platform_admin --dbname=platform_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:8.0.3-alpine
    container_name: order-platform-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-password}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD:-local-redis-password}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: apache/kafka:3.9.1
    container_name: order-platform-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: order-platform-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        for topic in \
          orders.placed.v1 \
          inventory.reservation-results.v1 \
          inventory.release-requested.v1 \
          inventory.released.v1 \
          notifications.requested.v1 \
          notifications.requested.v1.dlt; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 6 \
            --replication-factor 1
        done
    restart: "no"
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: order-platform-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge
      - backend

  sms-provider:
    image: wiremock/wiremock:3.13.2-alpine
    container_name: order-platform-sms-provider
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "9091:8080"
    volumes:
      - ./sms-provider/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge
      - backend

  whatsapp-provider:
    image: wiremock/wiremock:3.13.2-alpine
    container_name: order-platform-whatsapp-provider
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "9092:8080"
    volumes:
      - ./whatsapp-provider/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: order-platform-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge
      - observability

  k6:
    image: grafana/k6:1.0.0
    profiles:
      - load-test
    environment:
      BASE_URL: http://api-gateway:8080
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(90),p(95),p(99),min,max
    volumes:
      - ../load-tests:/scripts:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - edge
      - observability

  grafana:
    image: grafana/grafana:12.1.0
    container_name: order-platform-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - edge
      - observability

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: order-platform-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - edge
      - observability

networks:
  edge:
    name: order-platform-edge
    driver: bridge
  backend:
    name: order-platform-backend
    driver: bridge
    internal: true
  observability:
    name: order-platform-observability
    driver: bridge
    internal: true

volumes:
  postgres-data:
    name: order-platform-postgres-data
  redis-data:
    name: order-platform-redis-data
  kafka-data:
    name: order-platform-kafka-data
  prometheus-data:
    name: order-platform-prometheus-data
  grafana-data:
    name: order-platform-grafana-data
  mailpit-data:
    name: order-platform-mailpit-data
