server {
    listen 8080;
    server_name _;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway","implementation":"nginx-placeholder"}';
    }

    location /orders {
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://order-service:8080;
    }

    location /inventory {
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://inventory-service:8080;
    }

    location /notifications {
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://notification-service:8080;
    }

    location / {
        default_type application/json;
        return 200 '{"service":"api-gateway","status":"placeholder","routes":["/orders","/inventory","/notifications"]}';
    }
}
