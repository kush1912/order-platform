server {
    listen 8080;
    server_name _;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"notification-service","implementation":"nginx-placeholder"}';
    }

    location / {
        default_type application/json;
        return 200 '{"service":"notification-service","status":"placeholder"}';
    }
}
